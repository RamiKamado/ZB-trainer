<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ZBLL と ZBLS の手順を覚えるための練習ツール。ケースを選んでスクランブルとタイマーで回せます。">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14151c">
<meta property="og:type" content="website">
<meta property="og:title" content="ZBLL / ZBLS 手順練習ツール">
<meta property="og:description" content="ZBLL 480 ケース・ZBLS 299 ケースのスクランブル練習ツール（単一 HTML・オフライン動作）">
<!-- ホーム画面に追加したときに独立アプリとして開く -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZBLL練習">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314151c'/%3E%3Cg fill='%23FEFE00'%3E%3Crect x='6' y='6' width='6' height='6' rx='1'/%3E%3Crect x='13' y='6' width='6' height='6' rx='1'/%3E%3Crect x='20' y='6' width='6' height='6' rx='1'/%3E%3Crect x='6' y='13' width='6' height='6' rx='1'/%3E%3C/g%3E%3Cg fill='%23EE0000'%3E%3Crect x='13' y='13' width='6' height='6' rx='1'/%3E%3Crect x='20' y='13' width='6' height='6' rx='1'/%3E%3C/g%3E%3Cg fill='%230000F2'%3E%3Crect x='6' y='20' width='6' height='6' rx='1'/%3E%3Crect x='13' y='20' width='6' height='6' rx='1'/%3E%3Crect x='20' y='20' width='6' height='6' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<title>ZBLL / ZBLS 手順練習ツール</title>
<style>
:root{--ink:#14151c;--panel:#1c1e28;--line:#2e3140;--fg:#e8e9ef;--mute:#8d92a6;
 --y:#FEFE00;--ok:#00D800;--hold:#e8b64a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);overscroll-behavior:none;
 font-family:"Helvetica Neue",Inter,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
 font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit}
button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.screen{display:none;min-height:100%;flex-direction:column;
 padding-top:env(safe-area-inset-top,0px);
 padding-left:env(safe-area-inset-left,0px);
 padding-right:env(safe-area-inset-right,0px)}
.screen.on{display:flex}

/* ============ 選択画面 ============ */
#scr-sel .head{padding:16px 16px 10px;max-width:1100px;margin:0 auto;width:100%}
h1{font-size:17px;margin:4px 0 2px}
h1 em{font-style:normal;color:var(--y)}
.sub{color:var(--mute);font-size:12.5px;margin:0;line-height:1.6}
.sel-body{flex:1;max-width:1100px;margin:0 auto;width:100%;padding:0 16px 130px}
.pset{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 13px}
.pset .t{font-size:12px;color:var(--mute);letter-spacing:.07em;margin-bottom:8px}
.prow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.prow input{flex:1;min-width:130px;background:#12131a;border:1px solid var(--line);color:var(--fg);
 border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pitem{display:flex;gap:6px;align-items:center;background:#181a23;border:1px solid var(--line);
 border-radius:9px;padding:6px 8px 6px 11px;flex-wrap:wrap}
.pitem .pn{font-size:13px;flex:1;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .pc{color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums}
.pempty{color:var(--mute);font-size:12px;margin-top:8px}
.imppanel{display:none;margin-top:10px;border:1px solid var(--y);border-radius:10px;
 padding:10px 12px;background:#1f2030}
.imppanel.on{display:block}
.imppanel .t{font-size:12.5px;color:var(--fg);margin-bottom:8px;line-height:1.6}
.imppanel label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);
 padding:3px 0;cursor:pointer}
.imppanel input[type=checkbox]{accent-color:var(--y);width:15px;height:15px}
.zsec{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 13px}
.zhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.zhead .zt{font-size:15px;font-weight:650}
.zhead .zn{color:var(--mute);font-size:12px;margin-left:auto}
.sw{background:none;border:1px solid var(--line);color:var(--mute);border-radius:20px;
 padding:5px 13px;font-size:12.5px;cursor:pointer}
.sw[aria-pressed=true]{border-color:var(--y);color:var(--y);background:#221f04}
.zrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}
.zlab{color:var(--mute);font-size:11.5px;letter-spacing:.06em}
.zbody{display:none;margin-top:10px}
.zsec.open .zbody{display:block}
.zgrp{border-top:1px solid var(--line);padding:9px 0 3px}
.zgname{display:flex;align-items:center;gap:9px;color:var(--mute);font-size:11.5px;margin-bottom:6px}
.zgname svg{width:34px;height:34px;flex:none;display:block}
.zgname .gt2{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em}
.zcases{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.zc{background:#181a23;border:1px solid var(--line);border-radius:8px;padding:4px 2px 3px;cursor:pointer}
.zc svg{width:100%;aspect-ratio:1;height:auto;display:block;opacity:.45}
.zc .lb{font-size:8.5px;color:var(--mute);text-align:center;margin-top:1px}
.zc[aria-pressed=true]{border-color:var(--y);background:#221f04}
.zc[aria-pressed=true] svg{opacity:1}
.zc[aria-pressed=true] .lb{color:var(--y)}
.zc .lb{min-height:11px}
.zc.custom{border-color:#6f7ae0}
.zc.custom .lb{color:#98a2ff}
.zedit{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
.zedit .cur{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mute);
 flex:1;min-width:140px;word-break:break-word}
.zedit .cur b{color:var(--fg)}
.scr .zs{display:block;color:var(--mute);font-size:11px;margin-top:4px}
.statwrap{flex:1;max-width:1100px;margin:0 auto;width:100%;padding:0 16px 40px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-top:12px}
.sumbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.sumbox .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.sumbox .k{color:var(--mute);font-size:10.5px;letter-spacing:.06em;margin-top:2px}
.strow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #23252f}
.strow:last-child{border-bottom:0}
.strow .nmx{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strow .nx{color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums;width:46px;text-align:right}
.strow .av{font-variant-numeric:tabular-nums;font-size:14px;font-weight:650;width:58px;text-align:right}
.strow .bar{width:64px;height:5px;border-radius:3px;background:#23252f;overflow:hidden;flex:none}
.strow .bar i{display:block;height:100%}
.stgrp{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.stghead{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.stghead .gname{font-size:14px;font-weight:650;flex:1}
.stgrp .body{display:none;padding:0 10px 10px}
.stgrp.open .body{display:block}
.stsub{border-top:1px solid var(--line);padding:6px 2px}
.stsub>.h{display:flex;align-items:center;gap:10px;padding:4px 8px;cursor:pointer}
.stsub>.h .cpn{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.08em;flex:1;color:var(--mute)}
.stsub .cases{display:none;padding:2px 0 6px}
.stsub.open .cases{display:block}
.strow .fig{width:26px;height:26px;flex:none}
.strow .fig svg{width:26px;height:26px;display:block}
.sect2{color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 4px}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,14px);background:var(--y);
 color:#14151c;font-weight:650;font-size:13px;padding:8px 16px;border-radius:999px;
 opacity:0;pointer-events:none;transition:.16s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.gsec{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;user-select:none}
.ghead .gname{font-size:15px;font-weight:650}
.ghead .gcount{color:var(--mute);font-size:12px;margin-left:auto}
.ghead .caret{color:var(--mute);font-size:12px;transition:transform .15s}
.gsec.open .caret{transform:rotate(90deg)}
.gbody{display:none;padding:0 11px 11px}
.gsec.open .gbody{display:block}
.cpblk{border-top:1px solid var(--line);padding:9px 2px 4px}
.cphead{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.cpname{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;letter-spacing:.09em;color:var(--mute)}
.mini{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;
 padding:3px 9px;font-size:11px;cursor:pointer;touch-action:manipulation}
.mini:hover{border-color:var(--mute);color:var(--fg)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cs{background:#181a23;border:1px solid var(--line);border-radius:8px;padding:4px 2px 3px;cursor:pointer}
.cs svg{width:100%;aspect-ratio:1;height:auto;display:block;opacity:.45}
.cs .lb{font-family:ui-monospace,Menlo,monospace;font-size:9px;color:var(--mute);text-align:center;margin-top:2px}
.cs[aria-pressed=true]{border-color:var(--y);background:#221f04}
.cs[aria-pressed=true] svg{opacity:1}
.cs[aria-pressed=true] .lb{color:var(--y)}
.selbar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,21,28,.95);
 backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:10}
.selbar-in{max-width:1100px;margin:0 auto;
 padding:10px calc(16px + env(safe-area-inset-right,0px))
         calc(10px + env(safe-area-inset-bottom,0px))
         calc(16px + env(safe-area-inset-left,0px));
 display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.selbar .n{font-size:13px;color:var(--mute)}
.selbar .n b{color:var(--fg);font-size:16px}
.go{margin-left:auto;background:var(--y);border:0;color:#14151c;font-weight:700;font-size:14px;
 border-radius:9px;padding:11px 22px;cursor:pointer}
.go:disabled{background:var(--line);color:var(--mute)}

/* ============ 練習画面 ============ */
#scr-run.on{height:100dvh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.icon[aria-pressed=true]{border-color:var(--y);color:var(--y);background:#221f04}
.icon{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;
 padding:6px 11px;font-size:12.5px;cursor:pointer}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.modes button{background:none;border:0;color:var(--mute);padding:6px 11px;font-size:12.5px;cursor:pointer}
.modes button+button{border-left:1px solid var(--line)}
.modes button[aria-pressed=true]{background:var(--y);color:#14151c;font-weight:650}
.run{flex:1;min-height:0;display:grid;
 grid-template-columns:1fr 216px;grid-template-rows:auto minmax(0,1fr) auto;
 gap:10px 14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
 max-width:1100px;margin:0 auto;width:100%}
.scr{grid-column:1;font-family:ui-monospace,Menlo,monospace;font-size:clamp(15px,3.4vw,25px);
 line-height:1.45;text-align:center;letter-spacing:.02em;word-spacing:.18em}
.scr .cs-sm{display:block;color:var(--mute);font-size:11px;font-family:inherit;margin-top:5px}
.timer{grid-column:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 min-height:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tval{font-variant-numeric:tabular-nums;font-weight:300;font-size:clamp(46px,15vw,96px);line-height:1}
.timer.hold .tval{color:var(--hold)}
.timer.ready .tval{color:var(--ok)}
.thint{color:var(--mute);font-size:11.5px;margin-top:8px;text-align:center;line-height:1.5}
.side{grid-column:2;grid-row:1/4;min-height:0;display:flex;flex-direction:column;gap:8px;
 border-left:1px solid var(--line);padding-left:14px}
.stat{display:flex;justify-content:space-between;font-size:12.5px}
.stat span{color:var(--mute)} .stat b{font-variant-numeric:tabular-nums;font-weight:600}
.sect{color:var(--mute);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.times{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);padding-top:5px}
.trow{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;padding:2px 0}
.trow .c{color:var(--mute);font-family:ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .t{font-variant-numeric:tabular-nums}
.prev{grid-column:1;border-top:1px solid var(--line);padding-top:8px;min-width:0;
 display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;
 column-gap:10px;row-gap:3px;align-items:center}
.prev .pfig{grid-column:1;grid-row:1/3;line-height:0}
.prev .pfig svg{width:44px;height:44px;display:block}
.prev .nm{grid-column:2;grid-row:1;font-size:12.5px;min-width:0;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev .nm b{color:var(--y)}
.prev .tm{grid-column:3;grid-row:1;font-variant-numeric:tabular-nums;font-size:18px;justify-self:end}
.prev .add{grid-column:4;grid-row:1/3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-self:end}
.prev .sc{grid-column:2/4;grid-row:2;font-family:ui-monospace,Menlo,monospace;font-size:11px;
 color:var(--mute);line-height:1.4;overflow-wrap:anywhere;
 max-height:2.9em;overflow:auto}
.prev .zsol{grid-column:2/5;grid-row:3;color:var(--y);font-family:ui-monospace,Menlo,monospace;
 font-size:11px;line-height:1.4;overflow-wrap:anywhere;max-height:2.9em;overflow:auto}
.prev select{background:#12131a;border:1px solid var(--line);color:var(--fg);border-radius:7px;
 padding:5px 7px;font:inherit;font-size:11.5px;max-width:120px}
.prev .addbtn{background:none;border:1px solid var(--line);color:var(--mute);border-radius:7px;
 padding:5px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.prev .addbtn:hover:not(:disabled){border-color:var(--y);color:var(--y)}
.prev .addbtn.done{border-color:var(--ok);color:var(--ok)}
.prev .addbtn.del:hover:not(:disabled){border-color:#ff6b6b;color:#ff6b6b}
.prev .addbtn:disabled{opacity:.4;cursor:default}
.done{text-align:center;color:var(--ok);font-size:14px}
@media (max-width:700px){
  .run{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px}
  .side{grid-column:1;grid-row:auto;border-left:0;border-top:1px solid var(--line);
   padding-left:0;padding-top:8px;flex-direction:row;flex-wrap:wrap;gap:4px 14px}
  .stat{gap:5px} .sect,.times{display:none}
  .prev{grid-row:auto;grid-template-columns:auto minmax(0,1fr) auto;column-gap:8px}
  .prev .pfig svg{width:36px;height:36px}
  .prev .nm{font-size:11.5px}
  .prev .tm{font-size:15px}
  .prev .sc{grid-column:2/4;font-size:10px;max-height:2.8em}
  .prev .zsol{grid-column:1/4;font-size:10px;max-height:2.8em}
  .prev .add{grid-column:1/4;grid-row:4;justify-self:stretch;margin-top:4px}
  .prev .add select{flex:1;max-width:none}
  .prev .addbtn{flex:none}
}
</style>
</head>
<body>
<div class="screen on" id="scr-sel">
  <div class="head">
    <h1>ZBLL <em>手順練習</em>ツール</h1>
    <p class="sub">練習するケースを選んでから、下の「練習へ進む」を押してください。</p>
  </div>
  <div class="sel-body">
    <div class="pset">
      <div class="t">プリセット</div>
      <div class="prow">
        <input id="pname" type="text" placeholder="名前（例: 苦手なSune）" maxlength="40">
        <button class="mini" id="psave" type="button">選択中を保存</button>
      </div>
      <div class="prow" style="margin-top:7px">
        <button class="mini" id="pexport" type="button">書き出し</button>
        <button class="mini" id="pimport" type="button">ファイルから読み込み</button>
        <button class="mini" id="ppaste" type="button">貼り付けて読み込み</button>
        <input type="file" id="pfile" accept=".json,application/json" style="display:none">
      </div>
      <div class="imppanel" id="imppanel">
        <div class="t" id="impsum"></div>
        <label><input type="checkbox" id="imp-presets" checked> プリセット</label>
        <label><input type="checkbox" id="imp-custom" checked> 自作 ZBLS 手順</label>
        <label><input type="checkbox" id="imp-stats" checked> 統計</label>
        <label><input type="checkbox" id="imp-replace"> 統計を統合せず置き換える</label>
        <label><input type="checkbox" id="imp-settings"> 選択状態・設定も取り込む</label>
        <div class="prow" style="margin-top:8px">
          <button class="mini" id="impgo" type="button">取り込む</button>
          <button class="mini" id="impcancel" type="button">やめる</button>
        </div>
      </div>
      <div class="plist" id="plist"></div>
      <div class="pempty" id="pempty"></div>
    </div>
    <div class="zsec" id="zsec">
      <div class="zhead">
        <span class="zt">ZBLS</span>
        <button class="sw" id="zon" type="button" aria-pressed="false">ZBLSから練習する</button>
        <button class="mini" id="ztoggle" type="button">ケース一覧</button>
        <span class="zn" id="zn"></span>
      </div>
      <div class="zrow"><span class="zlab">スロット</span><span id="zslots"></span></div>
      <div class="zbody" id="zbody"></div>
    </div>
    <div class="pset" style="margin-top:14px">
      <div class="t">Slow（苦手なケースだけに絞る）</div>
      <div class="prow" style="margin-bottom:7px">
        <button class="sw" id="slowon" type="button" aria-pressed="false">Slow を使う</button>
      </div>
      <div class="prow">
        <span style="font-size:12.5px;color:var(--mute)">平均タイムが</span>
        <input id="slowsec" type="number" min="0.5" max="60" step="0.5" style="width:78px;min-width:0;flex:none">
        <span style="font-size:12.5px;color:var(--mute)">秒を超えるケースを出題</span>
      </div>
      <div class="pempty" id="slowinfo"></div>
    </div>
    <div id="sel"></div>
  </div>
  <div class="selbar"><div class="selbar-in">
    <span class="n"><b id="nsel">0</b> / 480 ケース</span>
    <button class="mini" id="selall" type="button">全選択</button>
    <button class="mini" id="selnone" type="button">全解除</button>
    <button class="mini" id="statopen" type="button">統計</button>
    <button class="go" id="go" type="button">練習へ進む</button>
  </div></div>
</div>

<!-- ============ 練習 ============ -->
<div class="screen" id="scr-run">
  <div class="topbar">
    <button class="icon" id="back" type="button">← ケース選択</button>
    <button class="icon" id="reveal" type="button" aria-pressed="false">ケース名を表示</button>
    <button class="icon" id="slowtog" type="button" aria-pressed="false" title="苦手なケースだけに絞る">Slow</button>

  return s+`</g></svg>`;
}
/* y 回転による面の読み替え（FR→BR→BL→FL） */
const YMAP=[{U:'U',D:'D',R:'R',L:'L',F:'F',B:'B'},{U:'U',D:'D',R:'B',L:'F',F:'R',B:'L'},
            {U:'U',D:'D',R:'L',L:'R',F:'B',B:'F'},{U:'U',D:'D',R:'F',L:'B',F:'L',B:'R'}];
const SLOTS=[['FR',0],['BR',1],['FL',2]];
function relabel(alg,k){
  if(!k) return alg;
  return alg.split(' ').map(t=>{const m=/^([UDRLFB])(w?)([2']?)$/.exec(t);
    return m?YMAP[k][m[1]]+m[2]+m[3]:t;}).join(' ');
}
const OPPF={U:'D',D:'U',R:'L',L:'R',F:'B',B:'F'};
/* 隣接キャンセルに加え、可換な面（U/D・R/L・F/B）を入れ替えて
   さらにキャンセルできるところまで詰め、1 本のスクランブルにする */
function reduce(seq){
  const re=/^([UDRLFB])([2']?)$/, amt={'':1,'2':2,"'":3}, inv={1:'',2:'2',3:"'"};
  let t=seq.split(' ').filter(Boolean), changed=true;
  while(changed){
    changed=false;
    for(let i=0;i<t.length-1;i++){
      const a=re.exec(t[i]); if(!a) continue;
      let j=i+1;
      while(j<t.length){
        const b=re.exec(t[j]); if(!b) break;
        if(b[1]===a[1]){
          const n=(amt[a[2]]+amt[b[2]])%4;
          t.splice(j,1); t.splice(i,1,...(n?[a[1]+inv[n]]:[]));
          changed=true; break;
        }
        if(OPPF[a[1]]!==b[1]) break;    // 可換でないならここまで
        j++;
      }
      if(changed) break;
    }
  }
  return t.join(' ');
}
function merge(a,b){
  const t=(a+' '+b).trim().split(' '); let ch=true;
  const re=/^([UDRLFB])([2']?)$/, amt={'':1,'2':2,"'":3}, inv={1:'',2:'2',3:"'"};
  while(ch){ ch=false; const o=[];
    for(const x of t.splice(0)){
      if(o.length){ const p=re.exec(o[o.length-1]), q=re.exec(x);
        if(p&&q&&p[1]===q[1]){ const n=(amt[p[2]]+amt[q[2]])%4; o.pop();
          if(n) o.push(p[1]+inv[n]); ch=true; continue; } }
      o.push(x);
    }
    t.push(...o);
  }
  return t.join(' ');
}

/* ユーザーが入力した手順を検証して、3スロット分のセットアップと手順に変換する */
function applyCustom(i, text){
  const tk=normTokens(text);
  if(!tk) return {err:'記号を解釈できませんでした'};
  const disp=derotate(tk,false), face=derotate(tk,true);
  if(!disp||!face) return {err:'この手順は扱えません'};
  const st=applySeq(normTokens(ZBLS[i][2][0]));
  if(!zblsSolved(applySeq(face,st.slice())))
    return {err:'このケースを解けていません（F2L完成＋エッジ向き揃いになりません）'};
  const setups=[], sols=[];
  for(let k=0;k<3;k++){
    const kk=[0,1,3][k];
    const f=toSlot(face,kk), d=toSlot(disp,kk);
    if(!f||!d) return {err:'スロット変換に失敗しました'};
    setups.push(reduce(invSeq(f).join(' ')));
    sols.push(d.join(' '));
  }
  zCustom[i]=[setups,sols]; saveZ();
  return {ok:sols[0]};
}

/* ---- 取り込み: まず中身を調べてから、何を入れるか選んでもらう ---- */
let pending=null;
function inspect(text){
  let o;
  try{ o=JSON.parse(text); }catch(e){ return {err:'JSON として読めませんでした'}; }
  if(Array.isArray(o)) o={presets:o};
  if(!o || typeof o!=='object') return {err:'中身を読み取れませんでした'};
  const out={presets:[], custom:{}, stats:null, settings:null, dropped:0, algBad:0};
  if(Array.isArray(o.presets)){
    for(const p of o.presets){
      if(!p || typeof p.name!=='string' || !Array.isArray(p.keys)){ out.dropped++; continue; }
      const keys=[...new Set(p.keys.filter(k=>BYKEY.has(k)))];
      out.dropped+=p.keys.length-keys.length;
      if(keys.length) out.presets.push({name:p.name.trim().slice(0,40)||'名前なし', keys});
    }
  }
  const zc=o.zblsCustom;
  if(zc && typeof zc==='object'){
    for(const [k,v] of Object.entries(zc)){
      const i=+k;
      if(!ZBLS[i] || !Array.isArray(v) || v.length!==2){ out.algBad++; continue; }
      const [setups,sols]=v;
      if(!Array.isArray(setups)||!Array.isArray(sols)||setups.length!==3||sols.length!==3){ out.algBad++; continue; }
      let ok=true;
      for(let s=0;s<3;s++){
        const t1=normTokens(setups[s]), t2=normTokens(sols[s]);
        if(!t1||!t2){ ok=false; break; }
        const st=applySeq(t1);
        if(zblsSolved(st) || !zblsSolved(applySeq(t2, st))){ ok=false; break; }
      }
      if(ok) out.custom[i]=[setups,sols]; else out.algBad++;
    }
  }
  const st=o.stats;
  const okEntry=e=>e && typeof e.n==='number' && typeof e.s==='number';
  if(st && typeof st==='object'){
    const zb={}, zs={};
    if(st.zbll) for(const [k,e] of Object.entries(st.zbll)) if(BYKEY.has(k)&&okEntry(e)) zb[k]=e;
    if(st.zbls) for(const [k,e] of Object.entries(st.zbls)) if(ZBLS[+k]&&okEntry(e)) zs[k]=e;
    if(Object.keys(zb).length||Object.keys(zs).length) out.stats={zbll:zb, zbls:zs};
  }
  const se=o.settings;
  if(se && typeof se==='object'){
    const s2={};
    if(Array.isArray(se.selection)) s2.selection=se.selection.filter(k=>BYKEY.has(k));
    if(se.zbls && typeof se.zbls==='object'){
      s2.zbls={ on: !!se.zbls.on,
        cases: Array.isArray(se.zbls.cases)?se.zbls.cases.filter(i=>ZBLS[i]):[],
        slots: Array.isArray(se.zbls.slots)?se.zbls.slots.filter(i=>i>=0&&i<3):[] };
    }
    if(typeof o.lastPreset==='string') s2.lastPreset=o.lastPreset;
    if(Object.keys(s2).length) out.settings=s2;
  }
  if(!out.presets.length && !Object.keys(out.custom).length && !out.stats && !out.settings)
    return {err:'取り込めるデータが見つかりませんでした'};
  return out;
}
function mergeStatTable(dst, src, replace){
  for(const [k,e] of Object.entries(src)){
    if(replace || !dst[k]){ dst[k]={n:e.n, s:e.s, b:e.b??null, w:e.w??null,
      r:Array.isArray(e.r)?e.r.slice(-12):[]}; continue; }
    const d=dst[k];
    d.n+=e.n; d.s+=e.s;
    if(e.b!=null && (d.b==null||e.b<d.b)) d.b=e.b;
    if(e.w!=null && (d.w==null||e.w>d.w)) d.w=e.w;
    if(Array.isArray(e.r)) d.r=d.r.concat(e.r).slice(-12);
  }
}
function applyImport(data, opt){
  const res={presets:0, merged:0, custom:0, statCases:0, settings:false};
  if(opt.presets) for(const p of data.presets){
    const ex=presets.find(x=>x.name===p.name);
    if(ex){ const b=ex.keys.length; ex.keys=[...new Set(ex.keys.concat(p.keys))];
      if(ex.keys.length!==b) res.merged++; }
    else { presets.push(p); res.presets++; }
  }
  if(opt.custom) for(const [i,v] of Object.entries(data.custom)){ zCustom[i]=v; res.custom++; }
  if(opt.stats && data.stats){
    if(opt.replace) stats={zbll:{}, zbls:{}};
    mergeStatTable(stats.zbll, data.stats.zbll, opt.replace);
    mergeStatTable(stats.zbls, data.stats.zbls, opt.replace);
    res.statCases=Object.keys(data.stats.zbll).length+Object.keys(data.stats.zbls).length;
  }
  if(opt.settings && data.settings){
    const s2=data.settings;
    if(s2.selection) sel=new Set(keysToIds(s2.selection));
    if(s2.zbls){ zOn=s2.zbls.on; zSel=new Set(s2.zbls.cases); zSlots=new Set(s2.zbls.slots); }
    if(s2.lastPreset) lastPreset=s2.lastPreset;
    res.settings=true;
  }
  savePresets(); saveZ(); saveSel(); saveStats(); sync(); syncZ();
  return res;
}
function showImport(text){

  pending=d;
  const nStat=d.stats?Object.keys(d.stats.zbll).length+Object.keys(d.stats.zbls).length:0;
  const parts=[`プリセット ${d.presets.length} 件`,
    `自作 ZBLS 手順 ${Object.keys(d.custom).length} 件`,
    `統計 ${nStat} ケース分`,
    d.settings?'選択状態・設定あり':'選択状態・設定なし'];
  if(d.dropped) parts.push(`無効なケース ${d.dropped} 件は除外`);
  if(d.algBad) parts.push(`検証に通らない手順 ${d.algBad} 件は除外`);
  el('impsum').textContent='このファイルの中身: '+parts.join(' / ');

}

function syncSlow(){
  const sl=selected();
  const fresh=sl.filter(c=>recent5(stats.zbll[CKEY(c)])===null).length;
  const n=slowPool().length;
  el('slowon').setAttribute('aria-pressed', slowOn);
  if(el('slowtog')) el('slowtog').setAttribute('aria-pressed', slowOn);
  el('slowinfo').textContent=
    `選択中 ${sl.length} 件のうち ${n} 件が対象です`
    +`（直近5回の平均が ${slowSec} 秒超 ${n-fresh} 件 ＋ 記録なし ${fresh} 件）。`;
  el('go').disabled=!canStart();
}
function setSlow(on){
  slowOn=on; save('zbll-practice-slowon',slowOn); syncSlow();

function sync(){

/* ---- セッション ---- */
let mode='random', queue=[], qi=0, cur=null, times=[], prev=null;
function selected(){ return CASES.filter(c=>sel.has(c.id)); }
/* Slow: 直近 5 回の平均がしきい値を超えているケース。
   記録がまだないケースは速いと分からないので対象に含める。 */
function isSlow(c){
  const r=recent5(stats.zbll[CKEY(c)]);
  return r===null || r > slowSec*1000;
}
function slowPool(){ return selected().filter(isSlow); }
/* 出題対象。Slow が ON ならそこから絞る。 */
function activeCases(){ return slowOn ? slowPool() : selected(); }
function shuffle(a){ a=a.slice();
  for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[a[i],a[k]]=[a[k],a[i]];} return a; }
function buildQueue(){
  const s=activeCases();
  if(mode==='straight') queue=s.slice();
  else if(mode==='recap') queue=shuffle(s);
  else queue=null;                      // random は都度抽選
  qi=0;
}
function nextCase(){
  if(mode==='random'){ const p=activeCases(); return p.length?pick(p):null; }
  if(!queue.length) return null;
  if(qi>=queue.length){
    if(mode==='straight'){ qi=0; }
    else return null;                   // recap 完了
  }
  return queue[qi++];
}
let curZ=null;          /* {idx, slot, sol} */
function newScramble(){
  cur=nextCase();
  if(!cur){
    if(slowOn && !slowPool().length){
      el('scramble').innerHTML=
        `<span class="done">直近5回の平均が ${slowSec} 秒を超えているケースがありません</span>`;
      el('thint').textContent='しきい値を下げるか、Slow をオフにしてください';
    } else {
      el('scramble').innerHTML=`<span class="done">Recap 完了（${times.length} 回）</span>`;
      el('thint').textContent='モードを選び直すと再開します';
    }
    renderStats(); return; }
  /* 実際のソルブ（AUF → ZBLS → AUF → ZBLL → AUF）の逆順・逆向きを 1 本に詰める。
     u3 が ZBLL 後、u2 が ZBLS と ZBLL の間、u1 が ZBLS 前の AUF にあたる。 */
  const AUFS=['','U','U2',"U'"];
  const u1=pick(AUFS), u2=pick(AUFS), u3=pick(AUFS);
  curZ=null;
  let s='';
  if(zOn && zSel.size && zSlots.size){
    const zi=pick([...zSel]), si=pick([...zSlots]);
    const setup=zSetups(zi)[si];
    let best=null;
    for(const cand of cur.scr){
      const r=reduce([u3,cand,u2,setup,u1].filter(Boolean).join(' '));
      const n=r?r.split(' ').length:0;
      if(!best||n<best.n) best={r,n};
    }
    s=best?best.r:'';
    curZ={idx:zi, slot:SLOTS[si][0], sol:zSols(zi)[si], u1, u2, u3, setup};
  } else {
    let best=null;
    for(const cand of cur.scr){
      const r=reduce([u3,cand,u1].filter(Boolean).join(' '));
      const n=r?r.split(' ').length:0;
      if(!best||n<best.n) best={r,n};
    }
    s=best?best.r:'';
  }
  curScramble=s;
  let html=s;
  if(curZ) html+=`<span class="zs">ZBLS: ${curZ.slot} スロット</span>`;
  if(revealed) html+=`<span class="cs-sm">${cur.g} / ${cur.cp} / ${cur.lab}</span>`;
  el('scramble').innerHTML=html;
  el('thint').textContent=HINT;
  renderStats();
}
let curScramble='';

/* ---- タイマー ---- */
const HOLD=350, HINT='長押し（スペース / 画面タッチ）→ 離してスタート、もう一度でストップ';
let state='idle', holdT=null, t0=0, raf=null;
const fmt=ms=>(ms/1000).toFixed(2);
function paint(){ el('tval').textContent=fmt(performance.now()-t0); raf=requestAnimationFrame(paint); }
function holdStart(){
  if(state==='running'){ stop(); return; }
  if(state!=='idle') return;
  state='hold'; el('timer').className='timer hold';
  holdT=setTimeout(()=>{ state='ready'; el('timer').className='timer ready'; }, HOLD);
}
function holdEnd(){
  if(state==='hold'){ clearTimeout(holdT); state='idle'; el('timer').className='timer'; return; }
  if(state==='ready'){
    state='running'; el('timer').className='timer';
    t0=performance.now(); raf=requestAnimationFrame(paint);
  }
}
function stop(){
  if(state!=='running') return;
  cancelAnimationFrame(raf); state='idle';
  const ms=performance.now()-t0; el('tval').textContent=fmt(ms);
  times.push({ms, c:cur});
  recordTime(ms, cur, curZ?curZ.idx:null);
  prev={c:cur, s:curScramble, ms, z:curZ};
  newScramble(); renderPrev(); renderStats();
}
el('timer').addEventListener('pointerdown',e=>{e.preventDefault();holdStart();});
el('timer').addEventListener('pointerup',e=>{e.preventDefault();holdEnd();});
el('timer').addEventListener('pointercancel',()=>{ if(state==='hold'||state==='ready'){clearTimeout(holdT);state='idle';el('timer').className='timer';} });
document.addEventListener('keydown',e=>{
  if(!el('scr-run').classList.contains('on')) return;
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) holdStart(); return; }
  if(state==='running'){ e.preventDefault(); stop(); return; }
});
document.addEventListener('keyup',e=>{
  if(!el('scr-run').classList.contains('on')) return;
  if(e.code==='Space'){ e.preventDefault(); holdEnd(); }
});

/* ---- 集計 ---- */
function avgOf(n){
  if(times.length<n) return null;
  const a=times.slice(-n).map(x=>x.ms).sort((x,y)=>x-y).slice(1,-1);
  return a.reduce((s,x)=>s+x,0)/a.length;
}
function renderStats(){
  const ms=times.map(x=>x.ms);
  el('k-n').textContent=ms.length;
  el('k-last').textContent=ms.length?fmt(ms[ms.length-1]):'—';
  el('k-best').textContent=ms.length?fmt(Math.min(...ms)):'—';
  el('k-worst').textContent=ms.length?fmt(Math.max(...ms)):'—';
  el('k-mean').textContent=ms.length?fmt(ms.reduce((a,b)=>a+b,0)/ms.length):'—';
  const a5=avgOf(5), a12=avgOf(12);
  el('k-ao5').textContent=a5?fmt(a5):'—';
  el('k-ao12').textContent=a12?fmt(a12):'—';
  const showProg = mode!=='random';
  el('row-prog').style.display=showProg?'flex':'none';
  if(showProg) el('k-prog').textContent=`${Math.max(0,queue.length-qi)} / ${queue.length}`;
  el('row-slow').style.display=slowOn?'flex':'none';
  if(slowOn) el('k-slow').textContent=`${slowPool().length} / ${sel.size}`;
  const box=el('times'); box.innerHTML='';
  times.slice().reverse().slice(0,60).forEach((t,i)=>{
    const d=document.createElement('div'); d.className='trow';
    d.innerHTML=`<span class="c">${times.length-i}. ${t.c.g} ${t.c.lab}</span><span class="t">${fmt(t.ms)}</span>`;
    box.appendChild(d);
  });
}
let target=null;                       /* 追加先プリセット名 */

function addPrevToPreset(btn){
  if(!prev) return toast('まだ記録がありません');

    name=(window.prompt('新しいプリセット名','苦手ケース')||'').trim();

    setTimeout(()=>{ btn.textContent=t; btn.classList.remove('done'); },1200); }

function removePrevFromPreset(btn){
  if(!prev) return toast('まだ記録がありません');
  if(target==='__new__' || !presets.length) return toast('プリセットを選んでください');

/* ---- 統計 ---- */
const fmt2=ms=>(ms/1000).toFixed(2);
/* 0 秒 = 緑, 10 秒 = 赤, それ以上は赤 */
function tcol(ms){
  const t=Math.max(0,Math.min(10,ms/1000));
  return `hsl(${Math.round(120*(1-t/10))} 85% 58%)`;
}
function agg(list){
  let n=0,s=0,b=null,w=null,rs=0,rc=0;
  for(const e of list){ if(!e) continue; n+=e.n; s+=e.s;
    if(e.b!==null&&(b===null||e.b<b)) b=e.b;
    if(e.w!==null&&(w===null||e.w>w)) w=e.w;
    const r=recent5(e); if(r!==null){ rs+=r; rc++; } }
  return {n,s,b,w,avg:n?s/n:null, r5:rc?rs/rc:null};
}
function statRow(label, a, opts){
  const o=opts||{};
  const d=document.createElement('div'); d.className='strow';
  if(o.fig) d.innerHTML=`<div class="fig">${o.fig}</div>`;
  const v=a[metric];
  const col=v===null?'var(--mute)':tcol(v);
  const pct=v===null?0:Math.max(4,Math.min(100,(v/1000)/10*100));
  d.innerHTML+=`<div class="nmx">${label}</div>`
    +`<div class="bar"><i style="width:${pct}%;background:${col}"></i></div>`
    +`<div class="nx">${a.n||'-'}</div>`
    +`<div class="av" style="color:${col}">${v===null?'—':fmt2(v)}</div>`;
  return d;
}
function renderStatScreen(){
  const box=el('statbody'); box.innerHTML='';
  const all=Object.values(stats.zbll);
  const A=agg(all);
  const everyTime=[];
  for(const e of all) everyTime.push(...e.r);
  const recent=everyTime.slice(-12);
  const aoN=n=>{ if(recent.length<n) return null;
    const a=recent.slice(-n).sort((x,y)=>x-y).slice(1,-1);
    return a.reduce((s,x)=>s+x,0)/a.length; };
  const tried=all.filter(e=>e.n>0).length;
  const sum=[['総ソルブ',A.n],['合計時間',A.n?(A.s/1000/60).toFixed(1)+'分':'—'],
    ['全体平均',A.avg===null?'—':fmt2(A.avg)],
    ['直近5平均',A.r5===null?'—':fmt2(A.r5)],
    ['ベスト',A.b===null?'—':fmt2(A.b)],
    ['ワースト',A.w===null?'—':fmt2(A.w)],
    ['練習済みケース',tried+' / '+CASES.length]];
  const seg=document.createElement('div'); seg.className='seg'; seg.style.marginTop='12px';
  [['avg','全体平均'],['r5','直近5回の平均']].forEach(([k,lab])=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=lab;
    b.setAttribute('aria-pressed', metric===k);
    b.onclick=()=>{ metric=k; renderStatScreen(); };
    seg.appendChild(b);
  });
  const g=document.createElement('div'); g.className='sumgrid';
  sum.forEach(([k,v])=>{ const b=document.createElement('div'); b.className='sumbox';
    b.innerHTML=`<div class="v">${v}</div><div class="k">${k}</div>`; g.appendChild(b); });
  box.appendChild(g); box.appendChild(seg);
  if(!A.n){ const p=document.createElement('p'); p.className='sub';
    p.style.marginTop='16px'; p.textContent='まだ記録がありません。練習するとここに集計されます。';
    box.appendChild(p); return; }

  // --- ZBLL: グループ → CP → ケース ---
  const h2=document.createElement('div'); h2.className='sect2';
  h2.textContent='ZBLL（'+(metric==='avg'?'全体平均':'直近5回の平均')+'）'; box.appendChild(h2);
  DATA.forEach(([gname,gkey,blocks])=>{
    const ids=CASES.filter(c=>c.g===gname);
    const ga=agg(ids.map(c=>stats.zbll[CKEY(c)]));
    const sec=document.createElement('section'); sec.className='stgrp';

    const col=gv===null?'var(--mute)':tcol(gv);
    head.innerHTML=`<span class="caret">▶</span><span class="gname">${gname}</span>`
      +`<span class="nx">${ga.n||'-'}</span>`
      +`<span class="av" style="color:${col}">${gv===null?'—':fmt2(gv)}</span>`;
    head.onclick=()=>sec.classList.toggle('open');
    sec.appendChild(head);
    const bd=document.createElement('div'); bd.className='body';
    blocks.forEach(([cp,cs])=>{
      const sub=document.createElement('div'); sub.className='stsub';
      const list=CASES.filter(c=>c.g===gname&&c.cp===cp);
      const sa=agg(list.map(c=>stats.zbll[CKEY(c)]));
      const sv=sa[metric];
      const sc=sv===null?'var(--mute)':tcol(sv);
      const hh=document.createElement('div'); hh.className='h';
      hh.innerHTML=`<span class="cpn">${cp}</span><span class="nx">${sa.n||'-'}</span>`
        +`<span class="av" style="color:${sc}">${sv===null?'—':fmt2(sv)}</span>`;
      hh.onclick=()=>sub.classList.toggle('open');
      sub.appendChild(hh);
      const cbox=document.createElement('div'); cbox.className='cases';
      list.forEach(c=>{
        const e=stats.zbll[CKEY(c)];
        cbox.appendChild(statRow(c.lab, agg([e]), {fig:planSvg(c.fd)}));
      });
      sub.appendChild(cbox); bd.appendChild(sub);
    });
    sec.appendChild(bd); box.appendChild(sec);
  });

  // --- 苦手ケース ---
  const slow=CASES.map(c=>({c,e:stats.zbll[CKEY(c)]})).filter(x=>x.e&&x.e.n>0)
    .sort((a,b)=>b.e.s/b.e.n - a.e.s/a.e.n).slice(0,10);
  if(slow.length){
    const t=document.createElement('div'); t.className='sect2'; t.textContent='平均が遅いケース 上位10';
    box.appendChild(t);
    const w=document.createElement('div'); w.className='stgrp'; const b2=document.createElement('div');
    b2.style.padding='4px 10px';
    slow.forEach(x=>b2.appendChild(statRow(`${x.c.g} / ${x.c.cp} / ${x.c.lab}`, agg([x.e]), {fig:planSvg(x.c.fd)})));
    w.appendChild(b2); box.appendChild(w);
  }

  // --- ZBLS ---
  const zEntries=Object.entries(stats.zbls).filter(([k,e])=>e.n>0);
  if(zEntries.length){
    const t=document.createElement('div'); t.className='sect2'; t.textContent='ZBLS（F2L ケース別）';
    box.appendChild(t);
    const byG=new Map();
    zEntries.forEach(([k,e])=>{ const i=+k; if(!ZBLS[i]) return;
      const g=ZBLS[i][0]; if(!byG.has(g)) byG.set(g,[]); byG.get(g).push([i,e]); });
    [...byG.keys()].sort((a,b)=>a-b).forEach(gi=>{
      const rows=byG.get(gi);
      const ga=agg(rows.map(r=>r[1]));
      const sec=document.createElement('section'); sec.className='stgrp';
      const gv2=ga[metric];
      const col=gv2===null?'var(--mute)':tcol(gv2);
      const head=document.createElement('div'); head.className='stghead';
      head.innerHTML=`<span class="caret">▶</span>`
        +`<span class="gname">F2L ${ZGROUPS[gi][0]}</span>`
        +`<span class="nx">${ga.n}</span>`
        +`<span class="av" style="color:${col}">${gv2===null?'—':fmt2(gv2)}</span>`;
      head.onclick=()=>sec.classList.toggle('open');
      const bd=document.createElement('div'); bd.className='body';
      rows.sort((a,b)=>b[1].s/b[1].n-a[1].s/a[1].n).forEach(([i,e])=>
        bd.appendChild(statRow('', agg([e]), {fig:obliqueSvg(ZBLS[i][1])})));
      sec.appendChild(head); sec.appendChild(bd); box.appendChild(sec);
    });
  }
}

el('statback').onclick=()=>show('sel');
el('statreset').onclick=()=>{ if(confirm('これまでのタイム記録をすべて消去しますか？')){
  stats={zbll:{},zbls:{}}; saveStats(); renderStatScreen(); toast('記録を消去しました'); } };
el('selall').onclick=()=>{ CASES.forEach(c=>sel.add(c.id)); sync(); };
el('selnone').onclick=()=>{ sel.clear(); sync(); };
el('mode').onclick=e=>{ const b=e.target.closest('button'); if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  mode=b.dataset.v; buildQueue(); newScramble(); renderStats(); };
el('reveal').onclick=e=>{ revealed=!revealed;
  e.currentTarget.setAttribute('aria-pressed',revealed);
  e.currentTarget.textContent=revealed?'ケース名を隠す':'ケース名を表示';
  if(cur) newScramble(); };
el('undo').onclick=()=>{ if(!times.length)return; times.pop(); renderStats(); };

buildSelection(); buildZbls();
el('zon').onclick=()=>{ zOn=!zOn; syncZ(); };
el('ztoggle').onclick=()=>{ const s=el('zsec');
  s.dataset.open = s.dataset.open==='1'?'0':'1'; syncZ(); };
sync(); syncZ(); renderPresets(); renderPrev();
</script>
</body>
</html>
